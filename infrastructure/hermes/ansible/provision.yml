# ansible/provision.yml — Hermes-Agent (Chiron) Provisioning Playbook
#
# Installs and configures Hermes-Agent on a fresh LXC container.
# Run after Terraform creates the container:
#
#   ansible-playbook -i inventory.ini provision.yml --ask-vault-pass
#
# Variables: group_vars/hermes_containers.yml (non-secret) +
#            group_vars/vault.yml (secrets — see vault.yml.example)
#
# Replaces the homegrown-Hermes provisioning that used roles/hermes/.
# The legacy role is kept on disk until the Week 8 rename cascade
# (apps/hermes/ → apps/chiron/); this playbook no longer references it.
---
- name: Provision Hermes-Agent (Chiron) Container
  hosts: hermes_containers
  vars_files:
    - group_vars/vault.yml

  vars:
    apt_cache_valid_time: 3600

  pre_tasks:
    - name: Verify Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.major >= 2
          - ansible_version.minor >= 10
        fail_msg: "Ansible 2.10+ is required"
      run_once: yes

    - name: Display deployment information
      ansible.builtin.debug:
        msg: |
          ============================================================
          Starting Hermes-Agent (Chiron) Container Provisioning
          ============================================================
          Target Host: {{ inventory_hostname }}
          OS:          {{ ansible_distribution }} {{ ansible_distribution_version }}
          Python:      {{ ansible_python_version }}
          CPU Cores:   {{ ansible_processor_vcpus }}
          RAM:         {{ (ansible_memtotal_mb / 1024) | round(2) }} GB

          Hermes-Agent:
            Version:     {{ hermes_agent_version }}
            Install dir: {{ hermes_agent_install_dir | default('/opt/hermes-agent') }}
            Profile:     {{ hermes_agent_active_profile | default('haley') }}

          ============================================================

    # ── Network: Freeze DHCP IP as Static ─────────────────────────────────
    # Proxmox overwrites in-container network config on boot, so the static
    # IP must be set at the Proxmox level via `pct set` rather than inside
    # the container.
    - name: Check if Proxmox container is using DHCP
      ansible.builtin.command: "pct config {{ container_vmid }}"
      register: pct_config
      delegate_to: "{{ proxmox_host }}"
      vars:
        ansible_user: root
      changed_when: false

    - name: Display current network information
      ansible.builtin.debug:
        msg: |
          Network Configuration:
            Current IP: {{ ansible_default_ipv4.address }}/{{ ansible_default_ipv4.prefix }}
            Gateway:    {{ ansible_default_ipv4.gateway }}
            MAC:        {{ ansible_default_ipv4.macaddress }}
            VMID:       {{ container_vmid }}
            Method:     {{ 'DHCP' if 'ip=dhcp' in pct_config.stdout else 'Static' }}

    - name: Freeze DHCP-assigned IP in Proxmox container config
      ansible.builtin.command: >
        pct set {{ container_vmid }} -net0
        name=eth0,bridge=vmbr1,hwaddr={{ ansible_default_ipv4.macaddress }},ip={{ ansible_default_ipv4.address }}/{{ ansible_default_ipv4.prefix }},gw={{ ansible_default_ipv4.gateway }}
      delegate_to: "{{ proxmox_host }}"
      vars:
        ansible_user: root
      when: "'ip=dhcp' in pct_config.stdout"

  tasks:
    # =========================================================================
    # 1. SYSTEM UPDATES
    # =========================================================================
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: "{{ apt_cache_valid_time }}"
      when: ansible_os_family == "Debian"

    - name: Upgrade all packages to latest versions
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == "Debian"

    - name: Verify internet connectivity
      ansible.builtin.uri:
        url: "https://pypi.org"
        method: HEAD
        status_code: [200, 301, 302]
        timeout: 30
      changed_when: false

    # =========================================================================
    # 2. DOTFILES
    # =========================================================================
    - name: Install dotfiles for root
      ansible.builtin.import_role:
        name: dotfiles

    # =========================================================================
    # 3. HERMES-AGENT (CHIRON)
    # =========================================================================
    - name: Install and configure Hermes-Agent
      ansible.builtin.import_role:
        name: hermes_agent

  post_tasks:
    # =========================================================================
    # 4. HEALTH CHECK
    # =========================================================================
    # Hermes-Agent doesn't expose a /health endpoint; gateway liveness is
    # checked via systemd + a Doctor exit-code probe.
    - name: Confirm hermes-agent service is active
      ansible.builtin.command: "systemctl is-active {{ hermes_agent_service_name | default('hermes-agent') }}"
      register: service_state
      changed_when: false
      failed_when: service_state.stdout != "active"

    - name: Run hermes doctor as smoke check
      ansible.builtin.shell: |
        set -o pipefail
        source /etc/hermes-agent/env
        hermes doctor
      args:
        executable: /bin/bash
      register: doctor_run
      changed_when: false
      failed_when: doctor_run.rc != 0

    - name: Confirm webhook port is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ hermes_agent_webhook_port | default(8644) }}"
        timeout: 30

    - name: Display connection information
      ansible.builtin.debug:
        msg: |
          ============================================================
          Hermes-Agent Provisioning Complete
          ============================================================

          Service:        hermes-agent.service (active)
          Active profile: {{ hermes_agent_active_profile | default('haley') }}
          Gateway:        webhook + telegram platforms enabled
          Webhook URL:    http://{{ inventory_hostname }}:{{ hermes_agent_webhook_port | default(8644) }}/webhooks/<route>

          Quick checks:
            ssh root@{{ inventory_hostname }} 'systemctl status hermes-agent.service'
            ssh root@{{ inventory_hostname }} 'hermes profile list'
            ssh root@{{ inventory_hostname }} 'hermes mcp test n8n-echo'

          End-to-end smoke:
            DM @HaleyChironBot on Telegram — Haley should respond.

          ============================================================
