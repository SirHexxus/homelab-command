# roles/hermes_agent/tasks/profile.yml
#
# Provision each Hermes-Agent profile (persona). Profiles isolate SOUL.md
# (persona prompt), USER.md (user model), MEMORY.md (episodic notes), and
# sessions. See [[Chiron Persona Design Principles]] for the three-layer
# concerns model and why USER.md content stays nearly-identical across
# personas while SOUL.md diverges.

- name: Create Hermes-Agent profiles
  ansible.builtin.shell: |
    set -o pipefail
    source {{ hermes_agent_config_dir }}/env
    export PATH="$HOME/.local/bin:$PATH"
    {{ hermes_agent_cli_symlink }} profile create "{{ item.name }}" \
      --description {{ item.description | quote }}
  args:
    executable: /bin/bash
    creates: "{{ hermes_agent_data_dir }}/profiles/{{ item.name }}/SOUL.md"
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Template per-profile SOUL.md (persona system prompt)
  ansible.builtin.template:
    src: "{{ item.soul_template }}"
    dest: "{{ hermes_agent_data_dir }}/profiles/{{ item.name }}/SOUL.md"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  notify: restart hermes-agent

- name: Template per-profile USER.md (user model — same person, persona-tuned emphasis)
  ansible.builtin.template:
    src: "{{ item.user_template }}"
    dest: "{{ hermes_agent_data_dir }}/profiles/{{ item.name }}/USER.md"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  notify: restart hermes-agent

- name: Set sticky default profile
  ansible.builtin.shell: |
    set -o pipefail
    source {{ hermes_agent_config_dir }}/env
    export PATH="$HOME/.local/bin:$PATH"
    current=$({{ hermes_agent_cli_symlink }} profile list 2>/dev/null | awk '/^[[:space:]]*◆/ {print $1}' | tr -d '◆')
    if [[ "$current" != "{{ hermes_agent_active_profile }}" ]]; then
      {{ hermes_agent_cli_symlink }} profile use "{{ hermes_agent_active_profile }}" >/dev/null
      echo "switched"
    else
      echo "unchanged"
    fi
  args:
    executable: /bin/bash
  register: profile_switch
  changed_when: "'switched' in profile_switch.stdout"
  notify: restart hermes-agent

# Per-profile config patching MUST happen after profile creation (the file
# `<profile_dir>/config.yaml` is created by `hermes profile create`) and is
# where the gateway actually reads from when a profile is active. Patching
# the global `~/.hermes/config.yaml` is useless once any profile is sticky
# — discovered the hard way Week 1 post-codify (webhook went dark ~5h).
- name: Patch per-profile config.yaml (model + platforms)
  ansible.builtin.shell: |
    set -o pipefail
    source {{ hermes_agent_venv_dir }}/bin/activate
    python3 - <<'PYEOF'
    import yaml
    from pathlib import Path
    p = Path("{{ hermes_agent_data_dir }}/profiles/{{ item.name }}/config.yaml")
    cfg = yaml.safe_load(p.read_text())
    desired_model = {
        "default":  "{{ hermes_agent_default_model }}",
        "provider": "{{ hermes_agent_model_provider }}",
        "base_url": "{{ hermes_agent_model_base_url }}",
    }
    desired_platforms = {
        "webhook": {
            "enabled": {{ hermes_agent_webhook_enabled | bool | string | lower | capitalize }},
            "extra": {
                "host":   "{{ hermes_agent_webhook_host }}",
                "port":   {{ hermes_agent_webhook_port }},
                "secret": Path("{{ hermes_agent_config_dir }}/webhook-secret").read_text().strip(),
            },
        },
        "telegram": {
            "enabled": {{ hermes_agent_telegram_enabled | bool | string | lower | capitalize }},
        },
    }
    changed = False
    if cfg.get("model") != desired_model:
        cfg["model"] = desired_model
        changed = True
    if (cfg.get("platforms") or {}) != desired_platforms:
        cfg["platforms"] = desired_platforms
        changed = True
    if changed:
        p.write_text(yaml.safe_dump(cfg, sort_keys=False, default_flow_style=False))
        print("WROTE_CHANGES")
    else:
        print("NO_CHANGES")
    PYEOF
  args:
    executable: /bin/bash
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: profile_config_patch
  # Distinct sentinels: a substring test like "'changed' in stdout" matches
  # "unchanged" too, which silently made this task always-changed (+ a spurious
  # gateway restart every run). Match the explicit write marker instead.
  changed_when: "'WROTE_CHANGES' in profile_config_patch.stdout"
  notify: restart hermes-agent
