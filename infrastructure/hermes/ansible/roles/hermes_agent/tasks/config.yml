# roles/hermes_agent/tasks/config.yml
#
# Provision /etc/hermes-agent/ (systemd EnvironmentFile + sidecar secrets),
# scaffold the global ~/.hermes/config.yaml (so `hermes doctor` works), and
# register MCP servers. The per-profile config.yaml patching (model +
# platforms) happens in profile.yml AFTER the active profile is created and
# selected — Hermes-Agent reads from the active profile's config.yaml, not
# the global one. Patching only the global is silent-failure territory; see
# the Week 1 post-codify dry-run incident (webhook went dark for ~5 hours
# until caught).

- name: Ensure /etc/hermes-agent exists
  ansible.builtin.file:
    path: "{{ hermes_agent_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Template /etc/hermes-agent/env (systemd EnvironmentFile)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ hermes_agent_config_dir }}/env"
    owner: root
    group: root
    mode: '0600'
  notify: restart hermes-agent

- name: Write webhook HMAC secret sidecar
  ansible.builtin.copy:
    content: "{{ vault_chiron_webhook_secret }}"
    dest: "{{ hermes_agent_config_dir }}/webhook-secret"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Ensure ~/.hermes exists
  ansible.builtin.file:
    path: "{{ hermes_agent_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Scaffold ~/.hermes/config.yaml if absent (one-shot via hermes doctor)
  ansible.builtin.shell: |
    set -o pipefail
    source {{ hermes_agent_config_dir }}/env
    export PATH="$HOME/.local/bin:$PATH"
    {{ hermes_agent_cli_symlink }} doctor >/dev/null 2>&1 || true
  args:
    executable: /bin/bash
    creates: "{{ hermes_agent_data_dir }}/config.yaml"

- name: Register MCP servers
  ansible.builtin.shell: |
    set -o pipefail
    source {{ hermes_agent_config_dir }}/env
    export PATH="$HOME/.local/bin:$PATH"
    if {{ hermes_agent_cli_symlink }} mcp list 2>/dev/null | grep -q "^[[:space:]]*{{ item.name }}\b"; then
      echo "exists"
    else
      printf "n\ny\n" | {{ hermes_agent_cli_symlink }} mcp add "{{ item.name }}" --url "{{ item.url }}"
      echo "added"
    fi
  args:
    executable: /bin/bash
  loop: "{{ hermes_agent_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: mcp_add
  changed_when: "'added' in mcp_add.stdout"
  notify: restart hermes-agent
