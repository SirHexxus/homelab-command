# roles/hermes_agent/defaults/main.yml
#
# Defaults for the Hermes-Agent installation (the NousResearch upstream).
# Overridden in group_vars/hermes_containers.yml for the live deployment.
#
# The local persona/skill layer is "Chiron" (see CLAUDE.md service roster).
# This role manages the upstream agent; persona content (SOUL.md, USER.md)
# is templated from the wiki / brand guide and applied per profile.

# ── Upstream source ─────────────────────────────────────────────────────────
hermes_agent_repo:    "https://github.com/NousResearch/hermes-agent.git"
hermes_agent_version: "11d93096b"   # spike-validated commit (v2026.5.28-17)

# ── Filesystem layout ───────────────────────────────────────────────────────
hermes_agent_install_dir: /opt/hermes-agent
hermes_agent_src_dir:     /opt/hermes-agent/hermes-agent
hermes_agent_venv_dir:    /opt/hermes-agent/hermes-agent/.venv
hermes_agent_bin:         /opt/hermes-agent/hermes-agent/.venv/bin/hermes
hermes_agent_cli_symlink: /usr/local/bin/hermes
hermes_agent_data_dir:    /root/.hermes
hermes_agent_config_dir:  /etc/hermes-agent
hermes_agent_ssh_dir:     /root/.ssh

# ── Mnemosyne wiki (cloned via tasks/wiki.yml) ─────────────────────────────
# The wiki is a git repo (markdown vault) consumed by the `mneme_wiki` skill.
# Same deploy key + git-user config pattern as the inbox_receiver role.
hermes_agent_wiki_repo: "git@github.com:SirHexxus/mnemosyne-wiki.git"
hermes_agent_wiki_dir:  /root/mneme/wiki

# ── homelab-command repo (cloned read-only via tasks/repo.yml) ─────────────
# Read-only working tree of the IaC monorepo so Chiron can verify repo state
# for scheduled checks. Uses a dedicated read-only deploy key
# (vault_chiron_repo_deploy_key); NEVER push from this clone — see AGENTS.md.
# NB: distinct from `hermes_agent_repo` above, which is the upstream agent src.
hermes_agent_command_repo: "git@github.com:SirHexxus/homelab-command.git"
hermes_agent_command_dir:  /opt/hermes-agent/repos/homelab-command

# ── Python ──────────────────────────────────────────────────────────────────
hermes_agent_python_version: "3.11"
hermes_agent_uv_bin:         /root/.local/bin/uv

# ── Model routing (Vertex AI via a local LiteLLM proxy — credit-covered) ───
# Hermes-Agent v0.15 has NO native Vertex provider (only AI Studio `gemini`
# + Code Assist OAuth), and Vertex needs short-lived SA OAuth tokens, not a
# static key. So primary inference goes through a LiteLLM proxy on loopback
# that authenticates to Vertex with a service-account JSON and refreshes
# tokens internally; Hermes-Agent just sees an OpenAI-compatible endpoint
# (provider: custom). This moves spend off out-of-pocket AI Studio onto the
# $1,000 GenAI App Builder credit. See [[hermes-agent-aux-tasks-layer3]].
hermes_agent_default_model:    gemini-2.5-flash
hermes_agent_model_provider:   custom
hermes_agent_model_base_url:   "http://127.0.0.1:4000/v1"

# Aux-task routing: the 5 high-volume / low-judgment tasks → Vertex Flash-Lite
# via the same proxy. The other 6 (vision, web_extract, compression, mcp,
# triage_specifier, kanban_decomposer) stay on `auto` (= primary). See the
# Layer-3 aux-router memo for the rationale and per-task breakdown.
hermes_agent_aux_lite_model:    gemini-2.5-flash-lite
hermes_agent_aux_lite_provider: custom
hermes_agent_aux_lite_base_url: "http://127.0.0.1:4000/v1"
hermes_agent_aux_lite_tasks:
  - skills_hub
  - approval
  - title_generation
  - profile_describer
  - curator

# ── LiteLLM proxy (Vertex AI sidecar) ──────────────────────────────────────
# Loopback-only (127.0.0.1) → reachable solely by on-host processes, so the
# proxy runs keyless; the real credential (SA JSON) stays 0600 root and is
# never exposed by the proxy. Pinned versions for reproducible spend shape.
hermes_agent_litellm_enabled:     true
hermes_agent_litellm_install_dir: /opt/litellm
hermes_agent_litellm_venv_dir:    /opt/litellm/venv
hermes_agent_litellm_config_dir:  /etc/litellm
hermes_agent_litellm_version:     "1.87.0"
hermes_agent_litellm_aiplatform_version: "1.154.0"
hermes_agent_litellm_host:        "127.0.0.1"
hermes_agent_litellm_port:        4000
hermes_agent_litellm_service_name: litellm

# Vertex project/location + where the SA JSON lands (deployed from vault).
hermes_agent_vertex_project:  gen-lang-client-0234750661
hermes_agent_vertex_location: us-central1
hermes_agent_vertex_sa_dest:  /etc/litellm/vertex-sa.json

# Models exposed by the proxy (model_name == route name Hermes-Agent calls).
hermes_agent_litellm_models:
  - gemini-2.5-flash
  - gemini-2.5-flash-lite
  - gemini-2.5-pro

# ── Webhook platform ───────────────────────────────────────────────────────
hermes_agent_webhook_enabled: true
hermes_agent_webhook_host:    "0.0.0.0"   # listen on all interfaces (n8n LXC reachability)
hermes_agent_webhook_port:    8644

# ── Telegram platform ──────────────────────────────────────────────────────
hermes_agent_telegram_enabled:       true
hermes_agent_telegram_allowed_users: ""   # comma-separated Telegram user IDs

# ── MCP servers (list of {name, url}) ──────────────────────────────────────
hermes_agent_mcp_servers: []

# ── Profile + persona ──────────────────────────────────────────────────────
# The role currently provisions a single persona: Haley. Margot/Quinn/Reese
# will be added as additional profiles in future weeks of the migration.
hermes_agent_active_profile: haley
hermes_agent_profiles:
  - name:        haley
    description: >-
      Senior personal assistant persona: coaching warmth + sardonic
      accountability; designed against [[The Man I Want To Be]] and the
      Hexxus Voice Identity Guide. Default for the Telegram surface.
    soul_template: haley-SOUL.md.j2
    user_template: haley-USER.md.j2

# ── systemd unit ───────────────────────────────────────────────────────────
hermes_agent_service_name:        hermes-agent
hermes_agent_service_restart_sec: 5
# Must exceed the gateway's drain_timeout (180s) per the spike-discovered
# stale-unit warning — otherwise systemd may SIGKILL mid-drain.
hermes_agent_service_stop_timeout: 210
