# ansible/inventory.ini - Phemius (Kodi HTPC) host inventory
#
# One service, multiple hosts (design doc §2). Both are bare metal on VLAN 80
# via wired drops to the TP-Link switch; addresses are DHCP reservations at
# pfSense, allocated once the Cat6 runs are in.
#
#   phemius-livingroom  Phase 1 — Intel N150 mini PC on the Vizio panel
#   phemius-office      Phase 2 — TCL 65S450G, gated on the server-closet move

[phemius]
phemius-livingroom ansible_host=CHANGEME
# phemius-office ansible_host=CHANGEME

[phemius:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
