# ansible/inventory.ini - Themis (Headwind MDM) host inventory
#
# One service, two possible hosts — never both at once:
#
#   PoC   the Incus system container "themis-poc" (Debian 13) on the ThinkPad,
#         created by bin/incus-poc-up. ansible_host is its incusbr0 address —
#         the laptop is both the Incus host and the Ansible controller.
#   Rack  LXC 111 at 10.0.50.23 (VLAN 50), after the server-closet move.
#         Uncomment that line and comment the PoC line; group_vars carry the
#         rest of the difference (postgres_host, themis_proxy_mode).
#
# [ariadne] is only a certificate source for cert-sync.yml.
#
# See docs/themis-design-doc.md §9 (PoC) and §10 (migration).

[themis]
themis-poc ansible_host=10.195.153.254
# themis ansible_host=10.0.50.23

[themis:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

[ariadne]
ariadne-01 ansible_host=10.0.60.10

[ariadne:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
