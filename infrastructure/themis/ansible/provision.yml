# provision.yml - Themis (Headwind MDM) provisioning
#
# Provisions Tomcat 9 + Headwind MDM against either the Incus PoC container or
# LXC 111 — the target is chosen in inventory.ini, the PoC/rack differences in
# group_vars/themis.yml. Order of first bring-up:
#
#   1. bin/incus-poc-up (host prep) and set ansible_host in inventory.ini
#   2. ansible-vault create group_vars/vault.yml   (vault_themis_* — 4 values)
#   3. rpadd themis.sirhexx.com 127.0.0.1:9 on Ariadne, then cert-sync.yml
#   4. ansible-playbook -i inventory.ini provision.yml --ask-vault-pass
#
#   ansible-playbook -i inventory.ini provision.yml --ask-vault-pass
#   ansible-playbook -i inventory.ini provision.yml --ask-vault-pass --tags headwind

---
- name: Provision Themis
  hosts: themis
  vars_files:
    - group_vars/vault.yml

  roles:
    - role: java_tomcat
      tags: [tomcat]

    - role: postgres_local
      tags: [postgres]
      when: postgres_host == 'localhost'

    - role: headwind_mdm
      tags: [headwind]

    - role: nginx_local
      tags: [nginx]
      when: themis_proxy_mode == 'local'

    - role: sophy_web
      tags: [sophy]
      when: sophy_web_enabled
